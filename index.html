<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandeau partenaires Finsecur</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  .fs-partners * { box-sizing: border-box; margin: 0; padding: 0; }
  .fs-partners {
    width: 100%;
    background: linear-gradient(90deg, #1a1a1a 0%, #2a1a15 50%, #1a1a1a 100%);
    padding: 22px 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  .fs-partners .fs-title {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 18px;
  }
  .fs-partners .fs-title::before,
  .fs-partners .fs-title::after {
    content: "";
    display: inline-block;
    width: 40px;
    height: 2px;
    background: #FF5426;
    vertical-align: middle;
    margin: 0 16px;
  }
  .fs-partners .fs-marquee {
    width: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
  }
  .fs-partners .fs-track {
    display: flex;
    width: max-content;
    animation: fs-scroll 35s linear infinite;
  }
  .fs-partners .fs-marquee:hover .fs-track { animation-play-state: paused; }
  .fs-partners .fs-list { display: flex; align-items: center; list-style: none; flex-shrink: 0; }
  .fs-partners .fs-item {
    flex-shrink: 0;
    margin: 0 18px;
    height: 80px;
    width: 170px;
    background: #ffffff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .fs-partners .fs-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(255,84,38,0.35);
  }
  .fs-partners .fs-item a {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    padding: 10px 14px;
  }
  .fs-partners .fs-item img {
    max-height: 56px;
    max-width: 140px;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  @keyframes fs-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (max-width: 768px) {
    .fs-partners .fs-item { margin: 0 10px; height: 60px; width: 130px; }
    .fs-partners .fs-item img { max-height: 44px; max-width: 110px; }
    .fs-partners .fs-title { font-size: 11px; }
    .fs-partners .fs-title::before, .fs-partners .fs-title::after { width: 25px; }
  }
</style>
</head>
<body>
<section class="fs-partners">
  <div class="fs-title">Ils nous font confiance</div>
  <div class="fs-marquee">
    <div class="fs-track">
      <ul class="fs-list">
        <li class="fs-item"><a href="https://www.e.leclerc/" target="_blank" rel="noopener" title="E.Leclerc"><img src="01_leclerc.png" alt="E.Leclerc"></a></li>
        <li class="fs-item"><a href="https://www.printemps.com/" target="_blank" rel="noopener" title="Printemps"><img src="02_printemps.png" alt="Printemps"></a></li>
        <li class="fs-item"><a href="https://www.hermes.com/" target="_blank" rel="noopener" title="Hermes"><img src="03_hermes.png" alt="Hermes"></a></li>
        <li class="fs-item"><a href="https://www.intermarche.com/" target="_blank" rel="noopener" title="Intermarche"><img src="04_intermarche.png" alt="Intermarche"></a></li>
        <li class="fs-item"><a href="https://www.casinosbarriere.com/" target="_blank" rel="noopener" title="Casino Barriere"><img src="05_casino_barriere.png" alt="Casino Barriere"></a></li>
        <li class="fs-item"><a href="https://www.auchan.fr/" target="_blank" rel="noopener" title="Auchan"><img src="06_auchan.png" alt="Auchan"></a></li>
        <li class="fs-item"><a href="https://www.metro.fr/" target="_blank" rel="noopener" title="Metro"><img src="07_metro.png" alt="Metro"></a></li>
